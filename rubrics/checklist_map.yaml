# Checklist map (BUILD_PLAN Appendix B.4). Used by onus/checks/checklist_audit.py.
#
# For a "Yes" answer, each deterministic item is backed when its condition holds in the paper body
# (sections other than the checklists and references; table renderings and figure captions included). The
# checklist justification itself never counts as backing.
# "No" and "NA" answers are not_applicable. Items not listed here use the prompt `checklist_item`.
# Patterns are case-insensitive regular expressions unless the item sets case_sensitive.

version: 2

items:
  error_bars:
    check: spread_or_pattern
    roles: [method, experiments, results, discussion, appendix, other]
    pattern: "\\b(?:std|s\\.d\\.|stdev|standard deviations?|standard errors?|s\\.e\\.m?\\.|sem|confidence intervals?|\\d{2}\\s?% ci|ci|error bars?|interquartile|iqr|variances? (?:across|over|between) (?:runs|seeds|trials|folds|repetitions)|credible intervals?|p-values?|t-tests?|wilcoxon|mann[- ]whitney|bootstrap(?:ped)? (?:confidence|ci|intervals?|resampl\\w*|estimates?)|permutation tests?|anova|chi-?squared?|bonferroni|fdr|benjamini|significance tests?|statistically significant)\\b|±|\\+/-|\\bp\\s*[<=≤]\\s*0?\\.\\d"
    unbacked: "no spread in any table and no std, CI, error-bar or significance-test language in the results text or captions"
  open_access:
    check: code_or_repo
    contradicted: "no source files were submitted and the paper links no code repository"
  limitations:
    check: limitations_present
    unbacked: "no limitations section or limitations paragraph was found"
  compute:
    check: pattern
    pattern: "\\b(?:gpus?|cpus?|tpus?|accelerators?|a100|h100|h200|v100|a6000|a40|l4|t4|rtx\\s?\\d{3,4}|apple m\\d|m\\d (?:pro|max|ultra)|gpu[- ]hours?|wall[- ]clock|run ?times?|ram|vram|\\d+\\s?gb|laptop|cluster|compute nodes?|\\d+(?:\\.\\d+)?\\s?(?:hours?|hrs?|minutes?|mins?)\\b)"
    unbacked: "no compute details (hardware, memory or run time) were found"
  experimental_details:
    check: pattern
    pattern: "\\b(?:learning rates?|batch sizes?|epochs?|optimi[sz]ers?|adam\\w*|sgd|temperature|random seeds?|seeds?|hyper-?parameters?|weight decay|dropout|top-?p|top-?k|max(?:imum)? tokens|warm-?up|iterations|train(?:ing)?/test split|validation split|(?:simulation|model|experimental|algorithm|default|training|system) parameters?|parameters? (?:were|are|was|is) (?:set|chosen|fixed|tuned|selected)|set to [-\\d.]+)\\b"
    unbacked: "no hyperparameter or setup details were found"
  reproducibility:
    check: any_of
    of: [open_access, experimental_details]
    unbacked: "neither code nor experimental details back the answer"
  theory:
    check: pattern
    case_sensitive: true
    pattern: "\\b(?:Theorem|Lemma|Proposition|Corollary)\\s*\\d|\\bProof\\b|\\bproof\\b of"
    unbacked: "no theorem, lemma or proof was found"
  claims:
    check: derived
    note: "Derived after verdicts: unbacked if any main abstract claim is contradicted."

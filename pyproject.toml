[project]
name = "onus"
version = "0.1.0"
description = "Onus: claim-to-evidence maps for research papers, with a record of what was verified and what wasn't."
authors = [{ name = "Avinash Ranganath" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "litellm>=1.60",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pymupdf>=1.25",
    "rapidfuzz>=3.9",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "modal>=1.0",
]

[project.scripts]
onus = "onus.cli:app"

[tool.poetry]
packages = [{ include = "onus", from = "src/backend" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
ruff = ">=0.5"
psycopg = { version = ">=3.2", extras = ["binary"] }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls Berget AI or Modal (costs money; run explicitly with -m live)"]
addopts = "-m 'not live'"
